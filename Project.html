<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Information</title>
    <link rel="stylesheet" href="poke.css">
</head>

<body>
    <div class="container">
        <h1>Pokemon Information</h1>
        <div id="pokemon-info">
            <input type="text" id="pokemon-input" placeholder="Enter Pokémon name" required>
            <button type="submit">Search</button>
            <div id="pokemon-details"></div>
            
        </form>
        <div id="result"></div>
        </div>
        <script src="poke.js"></script>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
        <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>  
        <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.min.js"></script>

        <script>
            function fetchPokemon() {
                const pokemonName = document.getElementById('pokemon-input').value.toLowerCase();
                const url = `https://pokeapi.co/api/v2/pokemon/${pokemonName}`;
                
                axios.get(url)
                    .then(response => {
                        const data = response.data;
                        const pokemonDetails = `
                            <h2>${data.name}</h2>
                            <img src="${data.sprites.front_default}" alt="${data.name}">
                            <p>Height: ${data.height}</p>
                            <p>Weight: ${data.weight}</p>
                            <p>Base Experience: ${data.base_experience}</p>
                        `;
                        document.getElementById('pokemon-details').innerHTML = pokemonDetails;
                    })
                    .catch(error => {
                        console.error('Error fetching Pokémon data:', error);
                        document.getElementById('pokemon-details').innerHTML = '<p>Pokémon not found.</p>';
                    });
            }
            document.querySelector('button').addEventListener('click', fetchPokemon);
        </script>
        
</body>

</html>
